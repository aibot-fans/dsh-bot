# 推送版本标签以后，给还没有 GitHub Release 的标签建一个，正文从提交生成（见 scripts/github-release.mjs）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同时推几个标签会各触发一次，排队跑，后跑的那次发现都建好了就什么都不做
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
