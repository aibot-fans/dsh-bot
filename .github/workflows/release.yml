# 推送以后按 CHANGELOG.md 建和更新版本标签的 GitHub Release：没有的建，正文和 CHANGELOG 不一样的改（见 scripts/github-release.mjs）。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 推 main 和推标签会各触发一次，排队跑，后跑的那次发现都对得上就什么都不做
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
